name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP '(?<=^version = ").*(?=")' pyproject.toml)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi
          echo "gating release v$TAG"

      - name: Verify changelog has a section for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qF "## [$TAG]" docs/changelog.md || {
            echo "docs/changelog.md has no '## [$TAG]' section — rename [Unreleased] first"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tram/ui/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Install dependencies
        run: pip install --no-cache-dir -e ".[dev,all]"

      - name: Install Playwright Chromium (gate browser smoke)
        # Pinned to the exact version in tram/ui/package.json — a mismatched
        # installer ships a different chromium revision than the suite's
        # playwright package expects, and every check fails at launch.
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Run release gate
        run: bash scripts/release-gate.sh --ci

  docker-standalone:
    name: Build & Push Standalone Docker image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        run: |
          VERSION=$(grep -oP '(?<=^version = ").*(?=")' pyproject.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trishul-ram
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push standalone image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-manager:
    name: Build & Push Manager Docker image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        run: |
          VERSION=$(grep -oP '(?<=^version = ").*(?=")' pyproject.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trishul-ram-manager
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push manager image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.manager
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-worker:
    name: Build & Push Worker Docker image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        run: |
          VERSION=$(grep -oP '(?<=^version = ").*(?=")' pyproject.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trishul-ram-worker
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package & Push Helm chart
    runs-on: ubuntu-latest
    needs: [docker-standalone, docker-manager, docker-worker]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        run: |
          VERSION=$(grep -oP '(?<=^version = ").*(?=")' pyproject.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Update Helm chart dependencies
        run: helm dependency update helm/

      - name: Package Helm chart
        run: helm package helm/

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Push Helm chart to OCI registry
        run: |
          helm push trishul-ram-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
