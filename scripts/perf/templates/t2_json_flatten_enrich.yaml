version: "1"

pipeline:
  name: t2-json-flatten-enrich
  description: >
    Transform bench T2 — json_flatten + enrich. Input is the NESTED corpus
    (gen_corpus.py --nested): session fields arrive under session_info.
    json_flatten lifts them to top level, then enrich joins the flattened
    record against a static subscriber lookup CSV on msisdn, adding
    region/subscriber_plan. The lookup file is generated by the runbook
    (lookup.csv: msisdn,region,subscriber_plan).
  enabled: true

  schedule:
    type: manual

  source:
    type: local
    path: ${PERF_IN_DIR:-/data/perf/in}
    file_pattern: "*.jsonl"

  serializer_in:
    type: json

  transforms:
    - type: json_flatten
      separator: "."

    - type: enrich
      lookup_file: ${PERF_ENRICH_LOOKUP:-/data/perf/lookup.csv}
      lookup_format: csv
      join_key: msisdn
      lookup_key: msisdn
      add_fields:
        - region
        - subscriber_plan
      on_miss: keep

  serializer_out:
    type: json

  sinks:
    - type: local
      path: ${PERF_OUT_DIR:-/data/perf/out}
      filename_template: "t2_{pipeline}_{timestamp}.json"

  on_error: continue