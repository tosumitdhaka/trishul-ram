## Capacity study — resource overlay M (medium): 500m CPU / 1Gi per TRAM pod.
##
## Helm paths touched (all three so the overlay works for either topology):
##   manager.resources          — manager StatefulSet (manager-statefulset.yaml:230)
##   worker.resources           — worker StatefulSet (worker-statefulset.yaml:134)
##   resources                  — standalone StatefulSet (statefulset.yaml:180)
##
## Usage (layered AFTER a topology file / --reuse-values):
##   helm upgrade trishul-ram helm/ -n trishul-ram --reuse-values \
##     -f scripts/perf/infra/values-res-M.yaml
## or with the dev script:
##   VALUES_FILE=scripts/perf/infra/values-res-M.yaml ./scripts/deploy-kind-tram-dev.sh --mode manager

manager:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

worker:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi
