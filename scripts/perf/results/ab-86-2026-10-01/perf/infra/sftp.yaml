## Capacity study — SFTP server (atmoz/sftp) for the SFTP source/sink benchmarks.
## Credentials: user `perf`, password `perfpw` (atmoz format user:pass:uid:gid:dir).
## In-cluster: sftp.trishul-ram.svc:22 · Host: any kind node IP, NodePort 30022.
## Storage: 1Gi local-path PVC mounted at /home/perf/upload (chroot home /home/perf).
apiVersion: v1
kind: Service
metadata:
  name: sftp
  namespace: trishul-ram
  labels:
    app.kubernetes.io/name: sftp
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: sftp
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
      nodePort: 30022
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-data
  namespace: trishul-ram
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sftp
  namespace: trishul-ram
  labels:
    app.kubernetes.io/name: sftp
spec:
  serviceName: sftp
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sftp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sftp
    spec:
      containers:
        - name: sftp
          image: atmoz/sftp:latest
          args: ["perf:perfpw:1000:1000:upload"]
          ports:
            - name: ssh
              containerPort: 22
          volumeMounts:
            - name: data
              mountPath: /home/perf/upload
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
