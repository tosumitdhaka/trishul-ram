{{- if .Values.postgresql.enabled }}
{{- /*
Chart-managed PostgreSQL credential secret (GH #51).

Rendered only when the Bitnami subchart points at this chart-managed secret
(postgresql.auth.existingSecret resolves to <release>-postgres). The chart owns
the password so TRAM_DB_URL can be assembled at render time and consumed by the
statefulsets via secretKeyRef (key: dbUrl):

  - postgresql.auth.password set  -> use it (dev deployments keep a predictable
                                     password and the subchart reads it here)
  - lookup <release>-postgres     -> reuse the existing value, so upgrades never
                                     rotate the password (no-op apply)
  - otherwise                     -> randAlphaNum 24, persisted on first install

The Bitnami subchart reads POSTGRES_PASSWORD / POSTGRES_POSTGRES_PASSWORD from
this secret via postgresql.auth.existingSecret; the TRAM statefulsets read the
full SQLAlchemy URL from the dbUrl key.

Upgrading a release that predates this secret (the old chart shipped
postgresql.auth.password "tram" and let Bitnami manage its own secret)? Pass
--set postgresql.auth.password=<your current password> once; afterwards the
chart-managed secret pins it.
*/}}
{{- $resolvedES := tpl (.Values.postgresql.auth.existingSecret | default "") . }}
{{- if eq $resolvedES (include "tram.postgresSecretName" .) }}
{{- $secretName := include "tram.postgresSecretName" . }}
{{- $password := .Values.postgresql.auth.password | default "" }}
{{- if not $password }}
{{-   $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{-   if $existing }}
{{-     $password = index $existing.data "password" | b64dec }}
{{-   else }}
{{-     $password = randAlphaNum 24 }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tram.labels" . | nindent 4 }}
type: Opaque
data:
  ## User password for postgresql.auth.username (POSTGRES_PASSWORD)
  password: {{ $password | b64enc | quote }}
  ## Superuser password for the "postgres" admin (POSTGRES_POSTGRES_PASSWORD)
  postgres-password: {{ $password | b64enc | quote }}
  ## Full SQLAlchemy URL consumed by TRAM pods (TRAM_DB_URL via secretKeyRef)
  dbUrl: {{ printf "postgresql+psycopg2://%s:%s@%s-postgresql/%s" .Values.postgresql.auth.username $password .Release.Name .Values.postgresql.auth.database | b64enc | quote }}
{{- end }}
{{- end }}