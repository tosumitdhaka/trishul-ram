version: "1"
pipeline:
  name: snmp-ten-target-pilot-to-sftp-jsonl
  description: Bounded ten-device polling pilot; replace documentation IPs before enabling.
  enabled: false
  schedule:
    type: interval
    interval_seconds: 300
  source:
    type: snmp_poll
    targets:
      - 192.0.2.11
      - 192.0.2.12
      - 192.0.2.13
      - 192.0.2.14
      - 192.0.2.15
      - 192.0.2.16
      - 192.0.2.17
      - 192.0.2.18
      - 192.0.2.19
      - 192.0.2.20
    max_concurrency: 4
    target_timeout: 60
    timeout: 1
    retries: 1
    community: public
    operation: get
    oids:
      - 1.3.6.1.2.1.1.1.0
      - 1.3.6.1.2.1.1.3.0
    resolve_oids: false
    classify: true
    index_depth: 1
  serializer_in:
    type: json
  transforms:
    - type: add_field
      fields:
        category: "'system'"
  serializer_out:
    type: ndjson
  sinks:
    - type: sftp
      host: sftp.example.com
      username: example_user
      password: changeme
      remote_path: /upload/snmp-pilot
      filename_template: "{pipeline}_{field.category}_{run_id}.jsonl"
      file_mode: append
  thread_workers: 1
  on_error: abort
